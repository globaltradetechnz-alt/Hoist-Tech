<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hoist Tech | Car Hoist Installation, Servicing & Repairs Auckland</title>
    <meta name="description" content="Hoist Tech - Professional car hoist installation, servicing and repairs in Auckland, NZ. Certified technicians, competitive prices, guaranteed workmanship." />
    <script>
      // GitHub Pages SPA redirect recovery
      (function() {
        var redirect = sessionStorage.getItem('gh-redirect');
        if (redirect) {
          sessionStorage.removeItem('gh-redirect');
          history.replaceState(null, null, redirect);
        }
      })();
    </script>
  </head>
  <body>
    <!-- Hidden static form so Netlify detects it at build time (Netlify Forms) -->
    <form name="contact" netlify hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <select name="service"></select>
      <textarea name="message"></textarea>
    </form>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
